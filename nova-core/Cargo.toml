[package]
name = "nova-core"
version = "1.0.0"
edition = "2024"

[dependencies]
winit = "0.30.13"
wgpu = "30.0.0"
pollster = "1.0.1"
image = "0.25.10"
glam = { version = "0.30", features = ["bytemuck"]}
bytemuck = { version = " 1.25.2", features = ["derive"] }
bitflags = "2.9"

### Egui integration dependencies
egui-wgpu = { version = "0.36.2", optional = true }
egui-winit = {version = "0.36.2", optional = true }
egui = {version = "0.36.2", optional = true }

[features]
egui = ["dep:egui-wgpu", "dep:egui-winit", "dep:egui"]